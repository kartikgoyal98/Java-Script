<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="page1.css" />
</head>

<body>
    <!-- form handling -->

    <form action="" id="form">
        <div>
            <label for="username">Name : </label>
            <input type="text" id="username" placeholder="Enter your username" />
            <span id="error-message" class="error-message" style="color: red"></span>
        </div>

        <div>
            <label for="email">Email : </label>
            <input value="kartik@123gmail.com" type="email" id="email" placeholder="Enter your email" />
            <span class="error-message" style="color: red"></span>
        </div>
        <!-- value set default value  -->
        <div>
            <label for="password">Password : </label>
            <input type="password" id="password" placeholder="Enter your password" />
            <span class="error-message" style="color: red"></span>
        </div>

        <p id="password-hint" class="hidden">Must be at least 8 characters</p>

        <div>
            <label for="=bio">Bio : </label>
            <textarea name="bio" id="bio" placeholder="Enter your bio..."></textarea>
            <p id="char-count"></p>
            <span class="error-message" style="color: red"></span>
        </div>

        <div>
            <input type="checkbox" id="checkbox" />
            <label for="checkbox">I agree to the terms and conditions.</label>
        </div>

        <div>
            <label for="country">Select your country :</label>
            <select name="country" id="country">
                <option value="modi ji">India</option>
                <!-- this is us of value -->
                <option value="usa">USA</option>
                <option value="uk">UK</option>
            </select>
            <span class="error-message" style="color: red"></span>
        </div>

        <button id="btn" type="submit">create account</button>
    </form>
    <h1 class="hidden">Account Created SuccessFully 🎉</h1>

    <script src="page1.js"></script>
</body>

</html>
